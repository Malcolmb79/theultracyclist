# Runs scripts/garmin-sync.mjs every 30 minutes so the site's Garmin data
# doesn't depend on a laptop being switched on.
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   GARMIN_OAUTH1_TOKEN          contents of .garmin/tokens/oauth1_token.json
#   GARMIN_OAUTH2_TOKEN          contents of .garmin/tokens/oauth2_token.json
#   APPLE_HEALTH_WEBHOOK_SECRET  the same secret the site checks on ingest
# The tokens come from running `node scripts/garmin-sync.mjs login` once
# locally. The OAuth1 token lasts about a year; each run refreshes the
# short-lived OAuth2 token from it.

name: Garmin sync

on:
  schedule:
    # Off the hour and half hour, when GitHub's scheduler is busiest and
    # most often late.
    - cron: "12,42 * * * *"
  workflow_dispatch:

concurrency:
  group: garmin-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Until the secrets exist the run is skipped with a notice rather than
      # failed, so an unconfigured repo doesn't send a failure email every
      # half hour. Once they are set, any real problem still fails the run.
      - name: Check the secrets are set
        id: secrets
        env:
          GARMIN_OAUTH1_TOKEN: ${{ secrets.GARMIN_OAUTH1_TOKEN }}
          GARMIN_OAUTH2_TOKEN: ${{ secrets.GARMIN_OAUTH2_TOKEN }}
          SITE_SECRET: ${{ secrets.APPLE_HEALTH_WEBHOOK_SECRET }}
        run: |
          if [ -z "$GARMIN_OAUTH1_TOKEN" ] || [ -z "$GARMIN_OAUTH2_TOKEN" ] || [ -z "$SITE_SECRET" ]; then
            echo "::notice::Garmin sync skipped - add the three secrets listed at the top of this workflow to turn it on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore the Garmin sign-in
        if: steps.secrets.outputs.ready == 'true'
        env:
          GARMIN_OAUTH1_TOKEN: ${{ secrets.GARMIN_OAUTH1_TOKEN }}
          GARMIN_OAUTH2_TOKEN: ${{ secrets.GARMIN_OAUTH2_TOKEN }}
          SITE_SECRET: ${{ secrets.APPLE_HEALTH_WEBHOOK_SECRET }}
        run: |
          mkdir -p .garmin/tokens
          printf '%s' "$GARMIN_OAUTH1_TOKEN" > .garmin/tokens/oauth1_token.json
          printf '%s' "$GARMIN_OAUTH2_TOKEN" > .garmin/tokens/oauth2_token.json
          node -e 'require("fs").writeFileSync(".garmin/config.json", JSON.stringify({ siteUrl: "https://theultracyclist.com", secret: process.env.SITE_SECRET }))'

      - name: Sync
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/garmin-sync.mjs sync --days 2
